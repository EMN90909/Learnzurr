services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    environment:
      - PUBLIC_API_BASE=/api
      - API_PORT=8081
      - HOST=0.0.0.0
      - PORT=3000
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/learnzur?sslmode=disable
    ports:
      - "8080:80"
    depends_on:
      - redis
      - postgres
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: learnzur
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  redisdata:
  pgdata:
