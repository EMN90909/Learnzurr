services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    environment:
      - APP_ENV=production
      - PUBLIC_API_BASE=/api
      - API_PORT=8081
      - HOST=0.0.0.0
      - PORT=3000
      - REDIS_URL=redis://redis:6379
      - REDIS_ADDR=redis:6379
    ports:
      - "8080:80"
    depends_on:
      - redis
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
volumes:
  redisdata:
