  media:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
      target: engine
    environment:
      - ENGINE=media
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/learnzur?sslmode=disable
      - REDIS_ADDR=redis:6379
    depends_on:
      - postgres
      - redis

  find:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
      target: engine
    environment:
      - ENGINE=find
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/learnzur?sslmode=disable
