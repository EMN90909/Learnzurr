services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - api

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    environment:
      - PUBLIC_API_BASE_URL=/api
    depends_on:
      - api

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
      target: api
    env_file: .env
    environment:
      - API_PORT=8080
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/learnzur?sslmode=disable
      - REDIS_ADDR=redis:6379
    depends_on:
      - postgres
      - redis

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
      target: worker
    env_file: .env
    environment:
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/learnzur?sslmode=disable
      - REDIS_ADDR=redis:6379
    depends_on:
      - postgres
      - redis

  gamfy:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
      target: engine
    environment:
      - ENGINE=gamfy
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/learnzur?sslmode=disable
      - REDIS_ADDR=redis:6379
    depends_on:
      - postgres
      - redis

  mearn:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
      target: engine
    environment:
      - ENGINE=mearn
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/learnzur?sslmode=disable
      - REDIS_ADDR=redis:6379
    depends_on:
      - postgres
      - redis

  lms:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
      target: engine
    environment:
      - ENGINE=lms
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/learnzur?sslmode=disable
      - REDIS_ADDR=redis:6379
    depends_on:
      - postgres
      - redis

  classroom:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
      target: engine
    environment:
      - ENGINE=classroom
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/learnzur?sslmode=disable
      - REDIS_ADDR=redis:6379
    depends_on:
      - postgres
      - redis

  san:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
      target: engine
    environment:
      - ENGINE=san
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/learnzur?sslmode=disable
      - REDIS_ADDR=redis:6379
    depends_on:
      - postgres
      - redis

  lanmat:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
      target: engine
    environment:
      - ENGINE=lanmat
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/learnzur?sslmode=disable
      - REDIS_ADDR=redis:6379
    depends_on:
      - postgres
      - redis

  notify:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
      target: engine
    environment:
      - ENGINE=notify
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/learnzur?sslmode=disable
      - REDIS_ADDR=redis:6379
    depends_on:
