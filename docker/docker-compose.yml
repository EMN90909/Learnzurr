services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    depends_on:
      - api
      - frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      - APP_ENV=production
      - PUBLIC_API_BASE=/api
  api:
    build:
      context: ./backend
      dockerfile: ../docker/Dockerfile.backend
    depends_on:
      - redis
  worker:
    build:
      context: ./backend
      dockerfile: ../docker/Dockerfile.backend
    command: ["/app/worker"]
    depends_on:
      - redis
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
