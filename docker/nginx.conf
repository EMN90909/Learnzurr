events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  sendfile on;
  upstream frontend { server frontend:3000; }
  upstream api { server api:8080; }
  server {
    listen 80;
    client_max_body_size 25m;
    location /api/ { proxy_pass http://api; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
    location / { proxy_pass http://frontend; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; proxy_set_header Host $host; }
  }
}
