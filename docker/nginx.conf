events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  sendfile on;
  gzip on;
  upstream api { server api:8080; }
  upstream frontend { server frontend:3000; }
  server {
    listen 80;
    server_name _;
    client_max_body_size 25m;
    location /api/ { proxy_pass http://api; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header Authorization $http_authorization; }
    location /_app/ { proxy_pass http://frontend; }
    location / { proxy_pass http://frontend; proxy_set_header Host $host; }
  }
}
